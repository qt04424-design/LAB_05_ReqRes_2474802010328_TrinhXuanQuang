name: API Test (Newman CI)

on:
  push:
    branches:
      - main

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman and htmlextra reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run API tests (Data-Driven with users.csv)
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          newman run ReqRes_Collection.json \
            -e ReqRes_Environment.json \
            -d users.csv \
            --env-var "apiKey=$REQRES_API_KEY" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export report.html

      - name: Upload report.html
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: report.html
