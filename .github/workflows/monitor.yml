name: ReqRes API Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check API Availability and Performance
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          node <<'EOF'
          const { performance } = require('node:perf_hooks');

          async function monitor() {
            const url = 'https://reqres.in/api/users?page=1';

            const startTime = performance.now();

            const response = await fetch(url, {
              headers: {
                'x-api-key': process.env.REQRES_API_KEY
              }
            });

            const responseTime = performance.now() - startTime;

            console.log('Status Code:', response.status);
            console.log('Response Time:', responseTime.toFixed(2), 'ms');

            if (response.status !== 200) {
              throw new Error('FAIL: Status Code is not 200');
            }

            if (responseTime >= 800) {
              throw new Error('FAIL: Response Time >= 800ms');
            }

            console.log('PASS: API is available');
            console.log('PASS: Response Time < 800ms');
          }

          monitor().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          EOF
