name: API Monitor (Shift-Right)

on:
  schedule:
    - cron: '0 * * * *'   # chay moi gio
  workflow_dispatch:       # cho phep chay thu cong

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman and htmlextra reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run monitor (availability + response time < 800ms)
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          newman run ReqRes_Monitor_Collection.json \
            --env-var "baseUrl=https://reqres.in" \
            --env-var "apiKey=$REQRES_API_KEY" \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export monitor-report.html

      - name: Upload monitor report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-report
          path: monitor-report.html
